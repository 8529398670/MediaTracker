# Ctrl+Z / Ctrl+Y (static/js/undo.js). The toast reads "<undone> <label>",
# e.g. "Undone: theme change", with a Redo button. Actions that announce
# themselves ("Name changed · Undo") use the label alone, capitalised, so a
# label is a phrase that reads after "Undone:". "nothing" is shown when there
# is nothing left to undo or redo; it is empty, so that toast is off. Empty
# button keys drop the button and keep the toast.
undo:
